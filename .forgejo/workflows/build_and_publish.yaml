name: build and publish to pypi :3

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/chechkout@v7
      - name: install hatch
        run: pip install hatch
      - name: build package
        run: hatch build
      - name: test package
        run: hatch test

  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: publish package
        uses: https://github.com/pypa/gh-action-pypi-publish@release/v1
        with:
          username = __token__
          password: ${{ secrets.PYPI_TOKEN }}
