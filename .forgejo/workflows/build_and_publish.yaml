name: build and publish to pypi :3

on:
  release:
    types: [published]
  # this is just for debugging/testing workflow runs
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
       
      # this requires ubuntu and doesn't work on debian 3:
      - uses: https://data.forgejo.org/actions/setup-python@v7
        with:
          python-version: 3.14
             
      - name: install hatch
        run: pip install hatch
       
      - name: build package
        run: hatch build
       
      - name: test package
        run: hatch test
       
      - name: publish package
        run: hatch publish --user __token__ --auth ${{ secrets.PYPI_TOKEN }}